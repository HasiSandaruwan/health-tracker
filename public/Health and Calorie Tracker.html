<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health and Calorie Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f8f7;--card:#fff;--ink:#15232e;--mute:#5a6b76;--line:#dbe4e1;--leaf:#2f7d5b;--sun:#e9a92b;--sky:#2f7fa8;--warn:#c8553d;--track:#e4ecea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a20;--card:#17262e;--ink:#e8f0ee;--mute:#9db0b8;--line:#2a3d46;--leaf:#4fb88a;--sun:#f0b94a;--sky:#5db3dc;--warn:#e98168;--track:#243842;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a20;--card:#17262e;--ink:#e8f0ee;--mute:#9db0b8;--line:#2a3d46;--leaf:#4fb88a;--sun:#f0b94a;--sky:#5db3dc;--warn:#e98168;--track:#243842;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;line-height:1.1;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;white-space:nowrap}
nav a{color:var(--mute);text-decoration:none;font-weight:700;font-size:15px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
nav a.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
nav a:focus-visible{outline:2px solid var(--sky)}
header{padding:34px 0 8px}
header h1{font-size:clamp(32px,5.5vw,58px);font-weight:800;letter-spacing:-.03em}
header p{color:var(--mute);margin:10px 0 0;max-width:40em}
main{padding-bottom:50px}
h2{font-size:clamp(24px,3.6vw,34px);font-weight:700;letter-spacing:-.02em;margin:34px 0 12px}
h3{font-size:19px;font-weight:700;margin-bottom:4px}
.sub{color:var(--mute);margin:0 0 16px;max-width:42em}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.lab{color:var(--mute);font-size:14px}
.big{font-family:"Bricolage Grotesque",sans-serif;font-size:34px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--track);color:var(--mute);white-space:nowrap}
.pill.bad{background:color-mix(in srgb,var(--warn) 20%,var(--card));color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--leaf) 20%,var(--card));color:var(--leaf)}
.row{display:grid;grid-template-columns:minmax(90px,170px) 1fr 84px;gap:12px;align-items:center;margin:11px 0;font-size:15px}
.row span:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bx{position:relative;height:14px;border-radius:99px;background:var(--track)}
.bx i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;min-width:0}
.bx u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.bx em{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--leaf) 30%,transparent)}
.ring{width:100%;max-width:210px;display:block;margin:0 auto}
.ring .t{stroke:var(--track)}.ring .p{stroke-linecap:round;animation:f 1.2s .1s cubic-bezier(.2,.7,.2,1) both}
@keyframes f{from{stroke-dasharray:0 502.65}to{stroke-dasharray:var(--d) 502.65}}
.ring text{fill:var(--ink);font-family:"Bricolage Grotesque",sans-serif}
.glasses{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:6px;margin:12px 0}
.glasses span{aspect-ratio:3/4;border-radius:4px 4px 10px 10px;border:2px solid var(--sky)}
.glasses .on{background:var(--sky)}.glasses .half{background:linear-gradient(to top,var(--sky) 50%,transparent 50%)}
.tl{list-style:none;margin:0;padding:0 0 0 20px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 14px 20px}
.tl li::before{content:"";position:absolute;left:-28px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--ink);border:3px solid var(--bg)}
.tl .water::before{background:var(--sky)}.tl .meal::before{background:var(--sun)}.tl .act::before{background:var(--leaf)}
.tl b{display:block;font-size:14px;color:var(--mute);font-weight:500}
.tb{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.note{background:color-mix(in srgb,var(--sun) 16%,var(--card));border:1px solid color-mix(in srgb,var(--sun) 50%,var(--line));border-radius:14px;padding:14px 16px;margin-top:14px}
ul.c{margin:6px 0;padding-left:20px}
.stack{display:flex;height:40px;border-radius:12px;overflow:hidden;margin:12px 0 8px}.stack div{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.hd{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
footer{padding:24px 0 50px;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
@media (max-width:700px){.g2{grid-template-columns:1fr}.row{grid-template-columns:1fr 70px}.row .bx{grid-column:1/-1;order:3}}
@media (prefers-reduced-motion:reduce){.ring .p{animation:none}}
</style>
</head>

{t:"6:00 pm",slot:"Snack",name:"Evening snack: Sri Lankan egg roll (bakery made, estimated)",p:8,c:28,f:15,items:[["Egg roll","1 roll (assumed)",280,8]]},
{t:"6:30 pm",slot:"Dinner",name:"Dinner",p:29.5,c:68,f:20,items:[["Red raw rice (Rathu Kekulu)","About 1.5 cups (220 g), 250-270 kcal",260,5.5],["Devilled fish (Malu Thel Dala)","About 85-100 g, 200-250 kcal",230,22],["Ladies\u2019 fingers curry (Bandakka Kirata)","About 3/4 cup (100 g), 85-105 kcal",95,2]]}],
ev:[["10:48 pm (17 Nov)","w",250],["11:15 pm (17 Nov)","s","Went to sleep"],["5:20 am","s","Woke up after about 6 h 5 min of sleep"],["5:43 am","w",250],["After 5:43 am","a","2 km walk, about 70 kcal burned"],["After the walk","w",500],["About 8:00 am","m",0],["After breakfast","w",250],["After 8:37 am","w",250],["After 8:37 am","m",1],["10:30 am","w",250],["11:10 am","w",125],["12:12 pm","w",125],["12:35 pm","m",2],["After lunch","w",250],["After lunch (logged later)","w",125],["2:42 pm","w",125],["3:30 pm","w",125],["4:00 pm","w",125],["4:41 pm","w",125],["5:30 pm","w",125],["6:00 pm","m",3],["After the egg roll","w",125],["6:30 pm","m",4],["7:30 pm","w",125],["10:00 pm","w",250]],

{id:"2026-11-19",label:"Thu 19 Nov",full:"Thursday, 19 November 2026",done:false,sleep:{h:8,txt:"Bed 10:15 pm (18 Nov), up 6:15 am. 8 h 0 min."},walk:null,meals:[{t:"7:40 am",slot:"Breakfast",name:"Breakfast",p:7.4,c:23.7,f:7,items:[["Boiled white kadala (chickpeas)","100 pieces, about 75-80 g",128,6.9],["Fresh coconut slice","1 strip, about 15 g",53,0.5]]}],
ev:[["10:15 pm (18 Nov)","s","Went to sleep"],["6:15 am","s","Woke up after 8 h 0 min of sleep"],["7:30 am","w",125],["7:40 am","m",0],["After breakfast","w",250],["9:10 am","w",125],["10:00 am","w",125]],notes:["Breakfast was about 90-95 g of food in total. All values are estimates.","Day in progress. Meals, water and activity are added as the day goes."]}
];
var $=function(s){return document.querySelector(s)},N=function(n){return Math.round(n).toLocaleString("en-US")},F=function(n){return String(Math.round(n*10)/10)};
function kc(d){return d.meals.reduce(function(a,m){return a+m.items.reduce(function(b,i){return b+i[2]},0)},0)}

h+='</table></div></div>'});

DAYS.forEach(function(d){var k=kc(d),s=st(d,k);h+='<tr><td><a href="#day-'+d.id+'" style="color:var(--leaf);font-weight:700">'+d.label+'</a></td><td>'+(d.meals.length?N(k):"-")+'</td><td>'+(d.meals.length?(k-T>0?"+":"")+N(k-T):"-")+'</td><td>'+(d.meals.length?F(pr(d))+" g":"-")+'</td><td>'+F(ml(d)/1000)+' L</td><td>'+F(d.sleep.h)+' h</td><td>'+(d.walk?d.walk.km+" km":"-")+'</td><td><span class="pill '+s[1]+'">'+s[0]+'</span></td></tr>'});
